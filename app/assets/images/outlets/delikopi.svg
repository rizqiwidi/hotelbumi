<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="delikopiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c1f" />
      <stop offset="45%" stop-color="#1a3c2a" />
      <stop offset="100%" stop-color="#2a523b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradDeli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e" />
      <stop offset="50%" stop-color="#e8d4af" />
      <stop offset="100%" stop-color="#b89354" />
    </linearGradient>

    <!-- Elegant Coffee / Art-Deco Rosette Pattern -->
    <pattern id="delipattern" width="40" height="40" patternUnits="userSpaceOnUse" opacity="0.06">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#c9a96e" stroke-width="1" />
      <circle cx="20" cy="20" r="4" fill="none" stroke="#c9a96e" stroke-width="0.8" />
      <path d="M 6 20 Q 20 6 34 20 Q 20 34 6 20 Z" fill="none" stroke="#c9a96e" stroke-width="0.8" />
    </pattern>

    <!-- Warm Golden Ambient Glow -->
    <radialGradient id="deliglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#delikopiGrad)" />
  <rect width="800" height="500" fill="url(#delipattern)" />
  <circle cx="400" cy="245" r="270" fill="url(#deliglow)" />

  <!-- Outer Double Luxury Border -->
  <rect x="25" y="25" width="750" height="450" rx="8" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="33" y="33" width="734" height="434" rx="4" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-opacity="0.2" />

  <!-- Corner Flourishes -->
  <!-- Top Left -->
  <path d="M 45 65 L 45 45 L 65 45" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="45" cy="45" r="2.5" fill="#c9a96e" />
  <!-- Top Right -->
  <path d="M 755 65 L 755 45 L 735 45" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="755" cy="45" r="2.5" fill="#c9a96e" />
  <!-- Bottom Left -->
  <path d="M 45 435 L 45 455 L 65 455" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="45" cy="455" r="2.5" fill="#c9a96e" />
  <!-- Bottom Right -->
  <path d="M 755 435 L 755 455 L 735 455" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="755" cy="455" r="2.5" fill="#c9a96e" />

  <!-- Coffee & Delicatessen Emblem -->
  <g transform="translate(400, 155)">
    <!-- Rosette Frame -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#goldGradDeli)" stroke-width="1.8" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="42" fill="#163826" fill-opacity="0.85" />

    <!-- Stylized Coffee Cup & Croissant Line Art -->
    <!-- Steam Lines -->
    <path d="M -8 -22 C -6 -28, -10 -32, -8 -36" fill="none" stroke="url(#goldGradDeli)" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
    <path d="M 0 -24 C 2 -30, -2 -34, 0 -38" fill="none" stroke="url(#goldGradDeli)" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <path d="M 8 -22 C 10 -28, 6 -32, 8 -36" fill="none" stroke="url(#goldGradDeli)" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />

    <!-- Cup Body & Saucer -->
    <path d="M -16 -12 L 16 -12 C 15 6, 9 14, 0 14 C -9 14, -15 6, -16 -12 Z" fill="none" stroke="url(#goldGradDeli)" stroke-width="2" />
    <path d="M 16 -7 C 22 -7, 22 4, 14 5" fill="none" stroke="url(#goldGradDeli)" stroke-width="1.8" />
    <path d="M -22 17 L 22 17" stroke="url(#goldGradDeli)" stroke-width="2" stroke-linecap="round" />

    <!-- Coffee Bean accent at base -->
    <ellipse cx="0" cy="27" rx="6" ry="4" fill="url(#goldGradDeli)" transform="rotate(-20, 0, 27)" />
    <path d="M -3 27 Q 0 25 3 28" fill="none" stroke="#1a3c2a" stroke-width="1" />
  </g>

  <!-- Typography: Outlet Name -->
  <text x="400" y="278" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="46" font-weight="700" fill="url(#goldGradDeli)" text-anchor="middle" letter-spacing="10">DELIKOPI</text>

  <!-- Typography: Sub-Header -->
  <text x="400" y="318" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fcfbf9" text-anchor="middle" letter-spacing="6" opacity="0.95">SPECIALTY COFFEE &amp; ARTISAN BAKERY</text>

  <!-- Divider Line with Coffee Bean Diamond -->
  <g transform="translate(400, 342)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#c9a96e" />
    <line x1="20" y1="0" x2="120" y2="0" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <!-- Feature Tags / Description Badges -->
  <text x="400" y="378" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#dfc38d" text-anchor="middle" letter-spacing="1.5">
    Fresh Roast Coffee · Gourmet Pastry &amp; Cakes · Delicatessen Selections
  </text>
  <text x="400" y="404" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#fcfbf9" text-anchor="middle" letter-spacing="3" opacity="0.65">
    BUMI SURABAYA CITY RESORT
  </text>
</svg>
