<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="kizahashiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f261a" />
      <stop offset="50%" stop-color="#1a3c2a" />
      <stop offset="100%" stop-color="#2d5a40" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e" />
      <stop offset="50%" stop-color="#e3cca1" />
      <stop offset="100%" stop-color="#b39155" />
    </linearGradient>

    <!-- Japanese Asanoha / Seigaiha Pattern -->
    <pattern id="seigaiha" width="60" height="30" patternUnits="userSpaceOnUse" opacity="0.07">
      <path d="M 0 30 A 30 30 0 0 1 60 30 M 10 30 A 20 20 0 0 1 50 30 M 20 30 A 10 10 0 0 1 40 30 M 30 0 A 30 30 0 0 1 90 0 M -30 0 A 30 30 0 0 1 30 0" fill="none" stroke="#c9a96e" stroke-width="1.5" />
    </pattern>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#kizahashiGrad)" />
  <rect width="800" height="500" fill="url(#seigaiha)" />
  <circle cx="400" cy="250" r="260" fill="url(#centerGlow)" />

  <!-- Outer Double Luxury Border -->
  <rect x="25" y="25" width="750" height="450" rx="8" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="33" y="33" width="734" height="434" rx="4" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-opacity="0.2" />

  <!-- Corner Japanese Art Flourishes -->
  <!-- Top Left -->
  <path d="M 45 65 L 45 45 L 65 45" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="45" cy="45" r="2.5" fill="#c9a96e" />
  <!-- Top Right -->
  <path d="M 755 65 L 755 45 L 735 45" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="755" cy="45" r="2.5" fill="#c9a96e" />
  <!-- Bottom Left -->
  <path d="M 45 435 L 45 455 L 65 455" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="45" cy="455" r="2.5" fill="#c9a96e" />
  <!-- Bottom Right -->
  <path d="M 755 435 L 755 455 L 735 455" fill="none" stroke="#c9a96e" stroke-width="2" />
  <circle cx="755" cy="455" r="2.5" fill="#c9a96e" />

  <!-- Decorative Crest / Japanese Kamon Graphic -->
  <g transform="translate(400, 155)">
    <!-- Outer concentric ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="42" fill="#1a3c2a" fill-opacity="0.8" />
    
    <!-- Stylized Bonsai / Pine Branch & Sakura Kamon -->
    <path d="M 0 -24 C 12 -24, 20 -14, 20 0 C 20 16, 8 26, 0 28 C -8 26, -20 16, -20 0 C -20 -14, -12 -24, 0 -24 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="-6" r="6" fill="url(#goldGrad)" />
    <circle cx="-9" cy="8" r="4" fill="url(#goldGrad)" />
    <circle cx="9" cy="8" r="4" fill="url(#goldGrad)" />
    <line x1="-28" y1="0" x2="-20" y2="0" stroke="#c9a96e" stroke-width="1.5" />
    <line x1="20" y1="0" x2="28" y2="0" stroke="#c9a96e" stroke-width="1.5" />
  </g>

  <!-- Japanese Kanji Watermark in Center Background -->
  <text x="400" y="275" font-family="'Noto Serif JP', 'Playfair Display', serif" font-size="110" font-weight="900" fill="#c9a96e" fill-opacity="0.06" text-anchor="middle" letter-spacing="24">階</text>

  <!-- Typography: Outlet Name -->
  <text x="400" y="278" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="12">KIZAHASHI</text>

  <!-- Typography: Sub-Header -->
  <text x="400" y="318" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fcfbf9" text-anchor="middle" letter-spacing="6" opacity="0.95">RESTORAN JEPANG AUTENTIK</text>

  <!-- Divider Line with Diamond -->
  <g transform="translate(400, 342)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#c9a96e" />
    <line x1="20" y1="0" x2="120" y2="0" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <!-- Feature Tags / Description Badges -->
  <text x="400" y="378" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#dfc38d" text-anchor="middle" letter-spacing="1.5">
    Sushi &amp; Sashimi · Teppanyaki · Ramen &amp; Udon · 2 Ruang Tatami @10 Orang
  </text>
  <text x="400" y="404" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#fcfbf9" text-anchor="middle" letter-spacing="3" opacity="0.65">
    BUMI SURABAYA CITY RESORT
  </text>
</svg>
